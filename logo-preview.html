<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo Preview</title>
    <style>
      :root {
        color-scheme: light;
        --zinc-50: #fafafa;
        --zinc-100: #f4f4f5;
        --zinc-200: #e4e4e7;
        --zinc-500: #71717a;
        --zinc-950: #09090b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: var(--zinc-950);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      main {
        width: min(860px, calc(100vw - 40px));
        padding: 44px 0;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 18px;
        font-weight: 600;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .item {
        min-height: 196px;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 18px;
        border: 1px solid var(--zinc-200);
        border-radius: 8px;
        background: #ffffff;
      }

      .label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        color: var(--zinc-500);
        font-size: 13px;
      }

      .label strong {
        color: var(--zinc-950);
        font-size: 15px;
      }

      .mark {
        display: inline-grid;
        place-items: center;
      }

      .mark svg {
        display: block;
      }

      .solid {
        color: var(--zinc-950);
      }

      .light {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--zinc-100);
        color: var(--zinc-950);
      }

      .dark {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--zinc-950);
        color: var(--zinc-50);
      }

      .swatch {
        width: 76px;
        height: 76px;
      }

      .app-icon {
        width: 18px;
        height: 18px;
        transform: translateY(1px);
      }

      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Logo Preview</h1>
      <div class="grid">
        <section class="item">
          <div class="mark solid swatch" aria-label="1. 纯色">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M5.7 12.4 6.6 5.9c.2-1.5 1.9-2.3 3.2-1.5l.6.3a3.2 3.2 0 0 0 3.2 0l.6-.3c1.3-.8 3 .1 3.2 1.5l.9 6.5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3.2 13.8c2.4-1.2 5.4-1.8 8.8-1.8s6.4.6 8.8 1.8"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <rect
                x="4.5"
                y="15.2"
                width="5.4"
                height="5.4"
                rx="1.65"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <rect
                x="14.1"
                y="15.2"
                width="5.4"
                height="5.4"
                rx="1.65"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <path
                d="M10 17.9h4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="label"><strong>1</strong><span>纯色</span></div>
        </section>

        <section class="item">
          <div class="mark light" aria-label="2. 浅色背景">
            <svg class="app-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M5.7 12.4 6.6 5.9c.2-1.5 1.9-2.3 3.2-1.5l.6.3a3.2 3.2 0 0 0 3.2 0l.6-.3c1.3-.8 3 .1 3.2 1.5l.9 6.5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3.2 13.8c2.4-1.2 5.4-1.8 8.8-1.8s6.4.6 8.8 1.8"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <rect
                x="4.5"
                y="15.2"
                width="5.4"
                height="5.4"
                rx="1.65"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <rect
                x="14.1"
                y="15.2"
                width="5.4"
                height="5.4"
                rx="1.65"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <path
                d="M10 17.9h4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="label"><strong>2</strong><span>浅色背景</span></div>
        </section>

        <section class="item">
          <div class="mark dark" aria-label="3. 深色背景">
            <svg class="app-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M5.7 12.4 6.6 5.9c.2-1.5 1.9-2.3 3.2-1.5l.6.3a3.2 3.2 0 0 0 3.2 0l.6-.3c1.3-.8 3 .1 3.2 1.5l.9 6.5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M3.2 13.8c2.4-1.2 5.4-1.8 8.8-1.8s6.4.6 8.8 1.8"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
              <rect
                x="4.5"
                y="15.2"
                width="5.4"
                height="5.4"
                rx="1.65"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <rect
                x="14.1"
                y="15.2"
                width="5.4"
                height="5.4"
                rx="1.65"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />
              <path
                d="M10 17.9h4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="label"><strong>3</strong><span>深色背景</span></div>
        </section>
      </div>
    </main>
  </body>
</html>
